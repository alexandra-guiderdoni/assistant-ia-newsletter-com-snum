# Repêchage d'un candidat écarté, lancé par la page de sélection (workflow_dispatch) :
# Albert résume l'article dans la rubrique choisie par l'éditeur, puis le résultat
# est déposé sur la branche donnees-veille, que la page relit sans jeton :
# https://raw.githubusercontent.com/alexandra-guiderdoni/assistant-ia-newsletter-com-snum/donnees-veille/repechages/<run_id>.json
# Le résultat est publié même en cas de refus : la page affiche alors le motif.
# Deux tâches : « repechage » appelle Albert sans pouvoir écrire dans le dépôt ;
# « publication » dépose le résultat, sans le jeton Albert.
name: Repêcher un candidat Veille SNUM

run-name: "Repêchage ${{ inputs.rubrique }} : ${{ inputs.url }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse HTTPS de l'article, parmi les 13 sources publiques"
        required: true
      rubrique:
        description: "Rubrique choisie par l'éditeur"
        required: true
        type: choice
        options:
          - numerique
          - ia
          - commande
          - rh
          - bercy
      debut:
        description: "Début de période, JJ/MM/AAAA ou AAAA-MM-JJ, par exemple 13/11/2026"
        required: true
      fin:
        description: "Fin de période, JJ/MM/AAAA ou AAAA-MM-JJ, par exemple 20/11/2026"
        required: true

# Lecture seule par défaut : seule la tâche « publication » peut écrire dans le dépôt.
permissions:
  contents: read

# Pas de groupe de concurrence : GitHub n'y garde qu'un run en attente et
# annulerait un repêchage lancé juste après un autre. Les envois simultanés
# vers donnees-veille sont réglés par les nouvelles tentatives de push.

jobs:
  # Lit la page et appelle Albert, sans aucun droit d'écriture sur le dépôt : le résultat
  # est transmis à la tâche suivante.
  repechage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      interrompu: ${{ steps.albert.outputs.interrompu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Un refus (code 1) n'arrête pas la tâche : son motif doit être publié.
      - name: Repêchage par Albert
        id: albert
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
          ALBERT_MODEL: openweight-large
          URL: ${{ inputs.url }}
          RUBRIQUE: ${{ inputs.rubrique }}
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}
        run: |
          RESULTAT="$RUNNER_TEMP/repechage.json"
          code=0
          python -m veille_snum.repecher --url="$URL" --rubrique="$RUBRIQUE" \
            --debut="$DEBUT" --fin="$FIN" --sortie="$RESULTAT" || code=$?
          if [ ! -s "$RESULTAT" ]; then
            # Le script s'est arrêté sans écrire son résultat : ce n'est pas un refus, la tâche
            # finira en échec une fois ce résultat de repli publié.
            echo "interrompu=oui" >> "$GITHUB_OUTPUT"
            # Résultat de repli : il porte l'adresse demandée, lue dans l'environnement et jamais
            # recopiée dans le script, pour que la page affiche ce motif au bon candidat.
            python -c 'import json, os, sys; json.dump({"schema_version": "SNUM_REPECHAGE_V1", "url": os.environ.get("URL", "")[:2048], "status": "erreur", "message": "Repêchage interrompu avant son résultat : consulter le journal de la tâche.", "article": None}, open(sys.argv[1], "w", encoding="utf-8"), ensure_ascii=False)' "$RESULTAT"
          fi
          echo "Code de sortie du repêchage : $code"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultat-repechage
          path: ${{ runner.temp }}/repechage.json
          retention-days: 1

  # Seule tâche autorisée à écrire dans le dépôt, et seulement sur donnees-veille. Elle
  # n'a ni le jeton Albert ni le code du prototype à exécuter : elle dépose le résultat.
  publication:
    needs: repechage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BRANCHE: donnees-veille
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: resultat-repechage
          path: ${{ runner.temp }}

      # Tâche précédente arrêtée avant de transmettre quoi que ce soit (délai dépassé, panne) :
      # un résultat de repli est publié quand même, avec l'adresse demandée, lue dans l'environnement.
      - name: Résultat de repli si rien n'a été transmis
        id: repli
        env:
          URL: ${{ inputs.url }}
        run: |
          RESULTAT="$RUNNER_TEMP/repechage.json"
          if [ ! -s "$RESULTAT" ]; then
            echo "sans_resultat=oui" >> "$GITHUB_OUTPUT"
            python3 -c 'import json, os, sys; json.dump({"schema_version": "SNUM_REPECHAGE_V1", "url": os.environ.get("URL", "")[:2048], "status": "erreur", "message": "Repêchage interrompu avant son résultat : consulter le journal de la tâche.", "article": None}, open(sys.argv[1], "w", encoding="utf-8"), ensure_ascii=False)' "$RESULTAT"
          fi

      # Le fichier est ajouté par un commit construit hors de l'arbre de travail :
      # la branche est créée orpheline au premier passage, jamais forcée ensuite.
      - name: Publication du résultat
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          RESULTAT="$RUNNER_TEMP/repechage.json"
          export GIT_INDEX_FILE="$RUNNER_TEMP/index-repechage"
          fichier="repechages/${GITHUB_RUN_ID}.json"
          blob=$(git hash-object -w "$RESULTAT")
          publie=non
          for essai in 1 2 3 4 5; do
            rm -f "$GIT_INDEX_FILE"
            parent=""
            etat=0
            git ls-remote --exit-code --heads origin "$BRANCHE" > /dev/null || etat=$?
            if [ "$etat" -eq 0 ]; then
              # Panne passagère du réseau : nouvel essai, comme pour ls-remote et push.
              if ! git fetch --quiet --depth 1 origin "$BRANCHE"; then
                echo "Essai $essai : lecture de la branche impossible, nouvelle tentative."
                sleep $((essai * 2))
                continue
              fi
              parent=$(git rev-parse FETCH_HEAD)
              git read-tree "$parent"
            elif [ "$etat" -ne 2 ]; then
              echo "Essai $essai : dépôt distant injoignable (code $etat)."
              sleep $((essai * 2))
              continue
            fi
            git update-index --add --cacheinfo "100644,$blob,$fichier"
            arbre=$(git write-tree)
            commit=$(git commit-tree "$arbre" ${parent:+-p "$parent"} -m "Repêchage ${GITHUB_RUN_ID}")
            if git push --quiet origin "$commit:refs/heads/$BRANCHE"; then
              publie=oui
              break
            fi
            echo "Essai $essai : envoi refusé (branche avancée entre-temps, ou autre cause affichée ci-dessus), nouvelle tentative."
            sleep $((essai * 2))
          done
          if [ "$publie" != oui ]; then
            echo "Résultat non publié après 5 essais." >&2
            exit 1
          fi
          echo "Résultat publié : $fichier ($commit)"

      # Un refus motivé (code 1) laisse la tâche verte ; un script arrêté sans résultat la rend rouge.
      - name: Signaler un repêchage interrompu
        if: needs.repechage.outputs.interrompu == 'oui' || steps.repli.outputs.sans_resultat == 'oui'
        run: |
          echo "Le repêchage s'est arrêté avant d'écrire son résultat : voir la tâche « repechage »." >&2
          exit 1

      # Résumé affiché en tête de la page du run : où lire le résultat.
      - name: Résumé du repêchage
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          lecture = (
              "https://raw.githubusercontent.com/alexandra-guiderdoni/assistant-ia-newsletter-com-snum/"
              f"{os.environ['BRANCHE']}/repechages/{os.environ['GITHUB_RUN_ID']}.json"
          )
          try:
              r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "repechage.json"), encoding="utf-8"))
          except (OSError, ValueError):
              r = {"status": "erreur", "message": "Aucun résultat produit.", "url": "", "article": None}
          lignes = [
              "### Repêchage Veille SNUM",
              f"- Statut : {r['status']}",
              f"- Message : {r['message']}",
              f"- Adresse demandée : {r['url'] or 'non relevée'}",
          ]
          if r.get("article"):
              a = r["article"]
              lignes.append(f"- Article : {a['title']} ({a['source']}, {a['publication_date_long']}), rubrique {a['rubric']}")
          lignes.append(f"- Résultat lu par la page de sélection : {lecture}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lignes) + "\n")
          print("\n".join(lignes))
          PY
