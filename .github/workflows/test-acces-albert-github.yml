# Test de faisabilité : Albert et les sources de Veille SNUM répondent-ils
# aux serveurs de GitHub ? Aucun secret, aucun jeton : un refus HTTP 401
# d'Albert prouve que l'API est joignable depuis GitHub.
name: Test d'accès à Albert depuis GitHub

on:
  push:
    branches: [config/test-albert-github]
    # Un envoi de documentation ne doit pas consommer d'appel Albert.
    paths: [.github/workflows/test-acces-albert-github.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Albert sans jeton (401 attendu)
        run: |
          set -u
          verdict=0
          for route in "GET /v1/models" "POST /v1/chat/completions"; do
            method=${route%% *}; path=${route#* }
            out=$(curl -s -m 20 -o /dev/null -w "%{http_code} %{time_total}" -X "$method" \
              -H "Content-Type: application/json" \
              "https://albert.api.etalab.gouv.fr$path" || true)
            code=${out%% *}
            echo "Albert $route : HTTP $code (${out#* } s)"
            echo "- Albert \`$route\` : HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "401" ] || verdict=1
          done
          if [ "$verdict" = 0 ]; then
            echo "Verdict : Albert joignable depuis GitHub (refus attendu sans jeton)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Verdict : réponse inattendue, Albert peut-être filtré pour GitHub." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Pages d'accueil des sources (informatif)
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          base = "veille-snum-webapp-v5-apres-egm/veille-snum/veille_snum/"
          sources = json.load(open(base + "sources.json", encoding="utf-8"))
          ua = "SNUMVeillePrototype/0.1 (+contact administratif; conservative crawl)"
          lines = []
          for s in sources:
              url = s.get("homepage")
              if not url:
                  lines.append(f"- {s['id']} : sans page publique, ignorée")
                  continue
              req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "text/html,*/*;q=0.5"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      result = f"HTTP {r.status}"
              except urllib.error.HTTPError as exc:
                  result = f"HTTP {exc.code}"
              except Exception as exc:
                  result = type(exc).__name__
              lines.append(f"- {s['id']} : {result}")
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n### Sources\n" + "\n".join(lines) + "\n")
          PY

  # Vraie collecte sans Albert (statut needs_albert attendu) : mêmes compteurs
  # que la page, sur la fenêtre de la collecte locale du 13 novembre 2026 à
  # 21 h 29 (147/148 pages reçues, 45 candidats, 8 sources partielles).
  collecte:
    # Déjà prouvée (run 43505069961) : relancée seulement à la main.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collecte complète sans jeton
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        env:
          ALBERT_API_KEY: ""
          ALBERT_MODEL: ""
        run: |
          python3 --version
          python3 - <<'PY'
          import os, time
          from collections import Counter
          from veille_snum.core import collect

          payload = {"edition_date": "2026-11-13", "window_start": "2026-11-06", "window_end": "2026-11-13"}
          t0 = time.monotonic()
          r = collect(payload)
          duree = round(time.monotonic() - t0)
          src = r["sources"]
          total = lambda k: sum(s.get(k) or 0 for s in src)
          lines = [
              f"- statut : {r['status']} (needs_albert attendu), durée {duree} s",
              f"- sources explorées sans réserve : {sum(s['status'] == 'checked' for s in src)}/13",
              f"- sources partielles ou plafonnées : {sum(s['status'] == 'partial' for s in src)}",
              f"- pages reçues sur pages tentées : {total('opened')}/{total('attempted')}",
              f"- adresses découvertes non visitées : {total('not_visited')}",
              f"- candidats trouvés : {len(r['candidates'])}",
              f"- erreurs de plan de site : {r.get('discovery_errors') or 0}",
              f"- statuts des sources : {dict(Counter(s['status'] for s in src))}",
              "",
              "Par source :",
          ]
          for s in src:
              lines.append(f"- {s['label']} : {s['status']}, {s.get('discovered', 0)} découvertes, "
                           f"{s.get('opened', 0)}/{s.get('attempted', 0)} pages reçues, "
                           f"{s.get('eligible', 0)} candidats, {s.get('technical_errors', 0)} erreurs")
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Collecte complète sans Albert\n" + "\n".join(lines) + "\n")
          PY

  # Un seul appel Albert authentifié (deux au plus si la première réponse
  # est rejetée, comme dans la collecte), sur un vrai candidat DINUM.
  albert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Un résumé Albert avec le jeton du dépôt
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, sys, time
          from urllib.error import HTTPError
          from veille_snum.core import (HttpClient, albert_summary, discover_source,
                                        iso_date, sources, validate_summary)

          def out(line):
              print(line)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(line + "\n")

          key = os.environ.get("ALBERT_API_KEY", "")
          if not key:
              out("Verdict : secret ALBERT_API_KEY absent du dépôt.")
              sys.exit(1)
          source = next(s for s in sources() if s["id"] == "numerique")
          found, _, _ = discover_source(source, iso_date("2026-11-06"), iso_date("2026-11-13"), HttpClient())
          if not found:
              out("Verdict : aucun candidat DINUM sur la période, test Albert non fait.")
              sys.exit(1)
          item = found[0]
          out(f"Candidat : {item['title']} ({item['url']})")
          feedback = None
          for attempt in (1, 2):
              t0 = time.monotonic()
              try:
                  summary = validate_summary(albert_summary(item, key, "openweight-large", timeout=60, feedback=feedback))
              except HTTPError as exc:
                  out(f"Verdict : Albert refuse l'appel authentifié, HTTP {exc.code}.")
                  sys.exit(1)
              except ValueError as exc:
                  out(f"Tentative {attempt} : réponse rejetée par la validation ({str(exc)[:80]}).")
                  feedback = str(exc)[:80]
                  continue
              except Exception as exc:
                  out(f"Verdict : échec réseau ou délai, {type(exc).__name__}.")
                  sys.exit(1)
              duree = round(time.monotonic() - t0, 1)
              if summary is None:
                  out(f"Verdict : appel authentifié réussi en {duree} s ; article jugé hors thématique.")
              else:
                  out(f"Verdict : appel authentifié réussi en {duree} s, tentative {attempt}.")
                  out(f"- thématique : {summary.get('rubric')}")
                  out(f"- fait : {summary.get('fact')}")
              sys.exit(0)
          out("Verdict : appel authentifié réussi, mais deux réponses rejetées par la validation.")
          sys.exit(1)
          PY
