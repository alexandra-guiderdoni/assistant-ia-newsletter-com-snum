# Publication sur GitHub Pages de la page de sélection
# (https://alexandra-guiderdoni.github.io/assistant-ia-newsletter-com-snum/) et des
# fichiers de la collecte, en deux temps :
#   titres     : exploration des sites sans Albert ; état et rapport (liste des titres) ;
#   resumes    : Albert résume les seuls titres gardés ; paquet V519, écartés, archive.
# Restent disponibles : collecte (les deux temps en une fois) et page seule.
# Paquet public par décision du 13 novembre 2026 (docs/designs/hebergement-github.md).
name: Publier le paquet Veille SNUM

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Date d'édition JJ/MM/AAAA, par exemple 20/11/2026 (vide : aujourd'hui, heure de Paris)"
        required: false
        default: ""
      debut:
        description: "Début de période JJ/MM/AAAA (vide : sept jours avant l'édition)"
        required: false
        default: ""
      fin:
        description: "Fin de période JJ/MM/AAAA (vide : date d'édition)"
        required: false
        default: ""
      mode:
        description: "titres : explorer les sites sans Albert ; resumes : résumer les titres gardés ; collecte : tout en une fois ; page seule : republier la page avec les fichiers en ligne"
        required: false
        type: choice
        options: [titres, resumes, collecte, page seule]
        default: titres
      selection:
        description: "Mode resumes seulement : liste JSON des titres gardés, remplie par la page de sélection"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Premier temps : ni jeton ni modèle Albert dans l'environnement de cette étape.
      # Un lancement sans entrée « mode » (ancienne page, appel direct de l'API) vaut « titres ».
      - name: Collecte des titres, sans Albert
        if: inputs.mode == 'titres' || inputs.mode == ''
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        env:
          EDITION: ${{ inputs.edition }}
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}
        run: |
          args=(--mode titres --sortie "$GITHUB_WORKSPACE/site" --run-id "$GITHUB_RUN_ID")
          [ -n "${EDITION:-}" ] && args+=(--edition "$EDITION")
          [ -n "${DEBUT:-}" ] && args+=(--debut "$DEBUT")
          [ -n "${FIN:-}" ] && args+=(--fin "$FIN")
          python -m veille_snum.publier "${args[@]}"

      # Second temps : la sélection est lue dans la variable SELECTION, jamais
      # recopiée dans le script ; le rapport des titres est relu sur le site en ligne.
      - name: Résumés des titres gardés
        if: inputs.mode == 'resumes'
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
          ALBERT_MODEL: openweight-large
          SELECTION: ${{ inputs.selection }}
          EDITION: ${{ inputs.edition }}
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}
        run: |
          args=(--sortie "$GITHUB_WORKSPACE/site" --run-id "$GITHUB_RUN_ID")
          [ -n "${EDITION:-}" ] && args+=(--edition "$EDITION")
          [ -n "${DEBUT:-}" ] && args+=(--debut "$DEBUT")
          [ -n "${FIN:-}" ] && args+=(--fin "$FIN")
          # Index des archives lu par git, jamais servi par un cache : des titres déjà
          # résumés sont refusés même si le site sert encore leur rapport. Sans index
          # (première collecte, panne passagère), le contrôle du rapport en ligne reste seul.
          index="$RUNNER_TEMP/archives-index.json"
          if git fetch --quiet --depth 1 origin donnees-veille && git show FETCH_HEAD:collectes/index.json > "$index" 2>/dev/null; then
            args+=(--archives "$index")
          else
            echo "Index des archives indisponible : contrôle par le seul rapport en ligne."
          fi
          python -m veille_snum.resumer "${args[@]}"

      - name: Collecte et paquet V519
        if: inputs.mode == 'collecte'
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
          ALBERT_MODEL: openweight-large
          EDITION: ${{ inputs.edition }}
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}
        run: |
          args=(--sortie "$GITHUB_WORKSPACE/site" --run-id "$GITHUB_RUN_ID")
          [ -n "${EDITION:-}" ] && args+=(--edition "$EDITION")
          [ -n "${DEBUT:-}" ] && args+=(--debut "$DEBUT")
          [ -n "${FIN:-}" ] && args+=(--fin "$FIN")
          python -m veille_snum.publier "${args[@]}"

      # Mode « page seule » : les fichiers en ligne sont repris tels quels. Après un
      # premier temps (phase titres), seul le rapport existe et il est exigé ; sinon
      # le paquet est exigé, comme avant la collecte en deux temps. GitHub Pages
      # répond parfois 503 un court instant : chaque lecture est retentée.
      - name: Reprendre les fichiers en ligne
        if: inputs.mode == 'page seule'
        run: |
          mkdir -p site
          base="https://alexandra-guiderdoni.github.io/assistant-ia-newsletter-com-snum"
          reprendre() { curl -fsS -m 30 --retry 3 --retry-delay 2 "$base/$1" -o "site/$1"; }
          facultatif() { reprendre "$1" || { rm -f "site/$1"; echo "$1 absent du site en ligne : ignoré."; }; }
          phase=""
          facultatif etat-collecte.json
          if [ -f site/etat-collecte.json ]; then
            phase=$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["phase"])' site/etat-collecte.json)
          fi
          if [ "$phase" = titres ]; then
            reprendre rapport-collecte.json
          else
            reprendre paquet-v519.json
            facultatif candidats-ecartes.json
            facultatif rapport-collecte.json
          fi

      - name: Page de sélection et ressources DSFR
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        run: |
          cp pages/*.html pages/*.js "$GITHUB_WORKSPACE/site/"
          cp -R veille_snum/dsfr "$GITHUB_WORKSPACE/site/dsfr"

      # Résumé affiché en tête de la page du run : où trouver la page, quoi en faire.
      - name: Résumé du run
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import collections, json, os

          site = "https://alexandra-guiderdoni.github.io/assistant-ia-newsletter-com-snum/"

          def lire(nom):
              chemin = os.path.join("site", nom)
              return json.load(open(chemin, encoding="utf-8")) if os.path.exists(chemin) else None

          mode = os.environ.get("MODE") or "titres"
          p = lire("paquet-v519.json")
          rapport = lire("rapport-collecte.json") or {}
          etat = lire("etat-collecte.json") or {}
          fr = lambda iso: "/".join(reversed(iso.split("-")))
          titres = {"titres": "Titres Veille SNUM", "resumes": "Paquet Veille SNUM, résumés des titres gardés",
                    "collecte": "Paquet Veille SNUM", "page seule": "Page Veille SNUM republiée"}
          lignes = [f"### {titres.get(mode, 'Veille SNUM')}", f"- Page de sélection : {site}"]
          if p:
              ecartes = (lire("candidats-ecartes.json") or {}).get("candidates", [])
              noms = {"numerique": "numérique", "ia": "IA", "commande": "commande", "rh": "RH", "bercy": "Bercy"}
              compte = collections.Counter(a["rubric"] for a in p["articles"])
              detail = ", ".join(f"{noms.get(r, r)} {n}" for r, n in compte.most_common())
              lignes += [
                  f"- Édition du {fr(p['edition_date'])}, période du {fr(p['window_start'])} au {fr(p['window_end'])}",
                  f"- {len(p['articles'])} articles : {detail} ; {len(p['watch'])} alerte(s) ; {len(ecartes)} candidat(s) écarté(s)",
                  f"- Fichiers : {site}paquet-v519.json et {site}candidats-ecartes.json",
                  "- Étape suivante : sur la page de sélection, garder ou écarter les articles, copier le JSON, puis le coller dans https://alexandra-guiderdoni.github.io/builder-mail-dsfr/snum.html",
              ]
          else:
              candidats = rapport.get("candidates") or []
              lues = sum(1 for s in rapport.get("sources") or [] if s.get("status") in ("checked", "partial"))
              if etat:
                  lignes.append(f"- Édition du {fr(etat['edition_date'])}, période du {fr(etat['window_start'])} au {fr(etat['window_end'])}")
              lignes += [
                  f"- {len(candidats)} titre(s) trouvé(s) sur {lues} source(s) lue(s), sans appel Albert ; aucun paquet à ce stade",
                  f"- Fichiers : {site}etat-collecte.json et {site}rapport-collecte.json",
                  "- Étape suivante : sur la page de sélection, cocher les titres à garder, puis « Rédiger les résumés »",
              ]
          if mode == "titres":
              lignes.append(f"- La collecte précédente n'est plus sur la page : si elle avait été résumée, elle reste consultable dans {site}archives.html")
          if mode == "page seule":
              lignes.append("- Fichiers en ligne repris tels quels : aucun appel Albert, aucune archive")
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              lignes.append("- Hors de main : fichiers produits mais non publiés")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lignes) + "\n")
          print("\n".join(lignes))
          PY

      # Archive de cette collecte, seulement quand un paquet vient d'être produit
      # (modes resumes et collecte) : les trois fichiers et son entrée d'index,
      # transmis à la tâche archivage.
      - name: Préparer l'archive
        if: inputs.mode == 'resumes' || inputs.mode == 'collecte'
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        run: |
          A="$RUNNER_TEMP/archive"
          mkdir -p "$A"
          cp "$GITHUB_WORKSPACE"/site/paquet-v519.json "$GITHUB_WORKSPACE"/site/candidats-ecartes.json "$GITHUB_WORKSPACE"/site/rapport-collecte.json "$A/"
          python -m veille_snum.archiver entree --site "$A" --run-id "$GITHUB_RUN_ID" --sortie "$A/entree.json"

      - if: inputs.mode == 'resumes' || inputs.mode == 'collecte'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-collecte
          path: ${{ runner.temp }}/archive
          retention-days: 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Seule tâche autorisée à écrire dans le dépôt, et seulement sur donnees-veille :
  # collectes/<id>/ (trois fichiers) et collectes/index.json, recalculé à chaque essai.
  archivage:
    needs: collecte
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'resumes' || inputs.mode == 'collecte')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BRANCHE: donnees-veille
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-collecte
          path: ${{ runner.temp }}/archive

      # Depuis la racine du dépôt : git update-index lit les chemins par rapport
      # au dossier courant.
      - name: Archiver la collecte
        env:
          PYTHONPATH: veille-snum-webapp-v5-apres-egm/veille-snum
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          A="$RUNNER_TEMP/archive"
          id=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$A/entree.json")
          # Un paquet sans article (tout jugé hors thématique, aucun candidat) est publié,
          # pour que ses candidats restent repêchables, mais n'encombre pas les archives.
          articles=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["articles"])' "$A/entree.json")
          if [ "$articles" -eq 0 ]; then
            echo "Paquet sans article : collecte $id non archivée."
            { echo "### Archive"; echo "- Paquet sans article : collecte non archivée"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/index-archive"
          publie=non
          for essai in 1 2 3 4 5; do
            rm -f "$GIT_INDEX_FILE" "$RUNNER_TEMP/index-ancien.json"
            parent=""
            etat=0
            git ls-remote --exit-code --heads origin "$BRANCHE" > /dev/null || etat=$?
            if [ "$etat" -eq 0 ]; then
              # Panne passagère du réseau : nouvel essai, comme pour ls-remote et push.
              if ! git fetch --quiet --depth 1 origin "$BRANCHE"; then
                echo "Essai $essai : lecture de la branche impossible, nouvelle tentative."
                sleep $((essai * 2))
                continue
              fi
              parent=$(git rev-parse FETCH_HEAD)
              git read-tree "$parent"
              git show "$parent:collectes/index.json" > "$RUNNER_TEMP/index-ancien.json" 2>/dev/null || rm -f "$RUNNER_TEMP/index-ancien.json"
            elif [ "$etat" -ne 2 ]; then
              echo "Essai $essai : dépôt distant injoignable (code $etat)."
              sleep $((essai * 2))
              continue
            fi
            python -m veille_snum.archiver fusion --ancien "$RUNNER_TEMP/index-ancien.json" --entree "$A/entree.json" --sortie "$RUNNER_TEMP/index.json"
            for nom in paquet-v519.json candidats-ecartes.json rapport-collecte.json; do
              git update-index --add --cacheinfo "100644,$(git hash-object -w "$A/$nom"),collectes/$id/$nom"
            done
            git update-index --add --cacheinfo "100644,$(git hash-object -w "$RUNNER_TEMP/index.json"),collectes/index.json"
            arbre=$(git write-tree)
            commit=$(git commit-tree "$arbre" ${parent:+-p "$parent"} -m "Archive de la collecte $id")
            if git push --quiet origin "$commit:refs/heads/$BRANCHE"; then
              publie=oui
              break
            fi
            echo "Essai $essai : envoi refusé (branche avancée entre-temps, ou autre cause affichée ci-dessus), nouvelle tentative."
            sleep $((essai * 2))
          done
          if [ "$publie" != oui ]; then
            echo "Archive non publiée après 5 essais." >&2
            exit 1
          fi
          {
            echo "### Archive"
            echo "- Collecte archivée : $id"
            echo "- Consultation : https://alexandra-guiderdoni.github.io/assistant-ia-newsletter-com-snum/archives.html"
          } >> "$GITHUB_STEP_SUMMARY"

  # Après l'archivage, et seulement s'il a réussi ou n'avait pas lieu d'être : un paquet
  # n'est jamais publié sans son archive, que la collecte suivante effacerait du site.
  deploiement:
    needs: [collecte, archivage]
    timeout-minutes: 10
    if: always() && github.ref == 'refs/heads/main' && needs.collecte.result == 'success' && (needs.archivage.result == 'success' || needs.archivage.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
