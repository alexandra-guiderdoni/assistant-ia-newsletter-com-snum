# Collecte complète avec Albert, puis publication sur GitHub Pages de la page
# de sélection (https://alexandra-guiderdoni.github.io/assistant-ia-newsletter-com-snum/),
# du paquet V519 (paquet-v519.json) et des candidats écartés (candidats-ecartes.json).
# Paquet public par décision du 13 novembre 2026 (docs/designs/hebergement-github.md).
name: Publier le paquet Veille SNUM

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Date d'édition JJ/MM/AAAA, par exemple 20/11/2026 (vide : aujourd'hui, heure de Paris)"
        required: false
        default: ""
      debut:
        description: "Début de période JJ/MM/AAAA (vide : sept jours avant l'édition)"
        required: false
        default: ""
      fin:
        description: "Fin de période JJ/MM/AAAA (vide : date d'édition)"
        required: false
        default: ""
      mode:
        description: "collecte : nouvelle collecte avec Albert ; page seule : republier la page avec le paquet déjà en ligne, sans appel Albert"
        required: false
        type: choice
        options: [collecte, page seule]
        default: collecte

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Collecte et paquet V519
        if: inputs.mode != 'page seule'
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
          ALBERT_MODEL: openweight-large
          EDITION: ${{ inputs.edition }}
          DEBUT: ${{ inputs.debut }}
          FIN: ${{ inputs.fin }}
        run: |
          args=(--sortie "$GITHUB_WORKSPACE/site")
          [ -n "${EDITION:-}" ] && args+=(--edition "$EDITION")
          [ -n "${DEBUT:-}" ] && args+=(--debut "$DEBUT")
          [ -n "${FIN:-}" ] && args+=(--fin "$FIN")
          python -m veille_snum.publier "${args[@]}"

      # Mode « page seule » : le paquet en ligne est repris tel quel ; il doit exister.
      - name: Reprendre le paquet en ligne
        if: inputs.mode == 'page seule'
        run: |
          mkdir -p site
          base="https://alexandra-guiderdoni.github.io/assistant-ia-newsletter-com-snum"
          curl -fsS -m 30 "$base/paquet-v519.json" -o site/paquet-v519.json
          for fichier in candidats-ecartes.json rapport-collecte.json; do
            curl -fsS -m 30 "$base/$fichier" -o "site/$fichier" || { rm -f "site/$fichier"; echo "$fichier absent du site en ligne : ignoré."; }
          done

      - name: Page de sélection et ressources DSFR
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        run: |
          cp pages/*.html pages/*.js "$GITHUB_WORKSPACE/site/"
          cp -R veille_snum/dsfr "$GITHUB_WORKSPACE/site/dsfr"

      # Résumé affiché en tête de la page du run : où trouver la page, quoi en faire.
      - name: Résumé du paquet
        run: |
          python - <<'PY'
          import collections, json, os

          site = "https://alexandra-guiderdoni.github.io/assistant-ia-newsletter-com-snum/"
          p = json.load(open("site/paquet-v519.json", encoding="utf-8"))
          chemin = "site/candidats-ecartes.json"
          ecartes = json.load(open(chemin, encoding="utf-8"))["candidates"] if os.path.exists(chemin) else []
          fr = lambda iso: "/".join(reversed(iso.split("-")))
          noms = {"numerique": "numérique", "ia": "IA", "commande": "commande", "rh": "RH", "bercy": "Bercy"}
          compte = collections.Counter(a["rubric"] for a in p["articles"])
          detail = ", ".join(f"{noms.get(r, r)} {n}" for r, n in compte.most_common())
          lignes = [
              "### Paquet Veille SNUM",
              f"- Page de sélection : {site}",
              f"- Édition du {fr(p['edition_date'])}, période du {fr(p['window_start'])} au {fr(p['window_end'])}",
              f"- {len(p['articles'])} articles : {detail} ; {len(p['watch'])} alerte(s) ; {len(ecartes)} candidat(s) écarté(s)",
              f"- Fichiers : {site}paquet-v519.json et {site}candidats-ecartes.json",
              "- Étape suivante : sur la page de sélection, garder ou écarter les articles, copier le JSON, puis le coller dans https://alexandra-guiderdoni.github.io/builder-mail-dsfr/snum.html",
          ]
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              lignes.append("- Hors de main : paquet produit mais non publié")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lignes) + "\n")
          print("\n".join(lignes))
          PY

      # Archive de cette collecte (pas en mode « page seule ») : les trois fichiers
      # et son entrée d'index, transmis à la tâche archivage.
      - name: Préparer l'archive
        if: inputs.mode != 'page seule'
        working-directory: veille-snum-webapp-v5-apres-egm/veille-snum
        run: |
          A="$RUNNER_TEMP/archive"
          mkdir -p "$A"
          cp "$GITHUB_WORKSPACE"/site/paquet-v519.json "$GITHUB_WORKSPACE"/site/candidats-ecartes.json "$GITHUB_WORKSPACE"/site/rapport-collecte.json "$A/"
          python -m veille_snum.archiver entree --site "$A" --run-id "$GITHUB_RUN_ID" --sortie "$A/entree.json"

      - if: inputs.mode != 'page seule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-collecte
          path: ${{ runner.temp }}/archive
          retention-days: 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Seule tâche autorisée à écrire dans le dépôt, et seulement sur donnees-veille :
  # collectes/<id>/ (trois fichiers) et collectes/index.json, recalculé à chaque essai.
  archivage:
    needs: collecte
    if: github.ref == 'refs/heads/main' && inputs.mode != 'page seule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BRANCHE: donnees-veille
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-collecte
          path: ${{ runner.temp }}/archive

      # Depuis la racine du dépôt : git update-index lit les chemins par rapport
      # au dossier courant.
      - name: Archiver la collecte
        env:
          PYTHONPATH: veille-snum-webapp-v5-apres-egm/veille-snum
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          A="$RUNNER_TEMP/archive"
          id=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$A/entree.json")
          export GIT_INDEX_FILE="$RUNNER_TEMP/index-archive"
          publie=non
          for essai in 1 2 3 4 5; do
            rm -f "$GIT_INDEX_FILE" "$RUNNER_TEMP/index-ancien.json"
            parent=""
            etat=0
            git ls-remote --exit-code --heads origin "$BRANCHE" > /dev/null || etat=$?
            if [ "$etat" -eq 0 ]; then
              git fetch --quiet --depth 1 origin "$BRANCHE"
              parent=$(git rev-parse FETCH_HEAD)
              git read-tree "$parent"
              git show "$parent:collectes/index.json" > "$RUNNER_TEMP/index-ancien.json" 2>/dev/null || rm -f "$RUNNER_TEMP/index-ancien.json"
            elif [ "$etat" -ne 2 ]; then
              echo "Essai $essai : dépôt distant injoignable (code $etat)."
              sleep $((essai * 2))
              continue
            fi
            python -m veille_snum.archiver fusion --ancien "$RUNNER_TEMP/index-ancien.json" --entree "$A/entree.json" --sortie "$RUNNER_TEMP/index.json"
            for nom in paquet-v519.json candidats-ecartes.json rapport-collecte.json; do
              git update-index --add --cacheinfo "100644,$(git hash-object -w "$A/$nom"),collectes/$id/$nom"
            done
            git update-index --add --cacheinfo "100644,$(git hash-object -w "$RUNNER_TEMP/index.json"),collectes/index.json"
            arbre=$(git write-tree)
            commit=$(git commit-tree "$arbre" ${parent:+-p "$parent"} -m "Archive de la collecte $id")
            if git push --quiet origin "$commit:refs/heads/$BRANCHE"; then
              publie=oui
              break
            fi
            echo "Essai $essai : la branche a avancé entre-temps, nouvelle tentative."
            sleep $((essai * 2))
          done
          if [ "$publie" != oui ]; then
            echo "Archive non publiée après 5 essais." >&2
            exit 1
          fi
          {
            echo "### Archive"
            echo "- Collecte archivée : $id"
            echo "- Consultation : https://alexandra-guiderdoni.github.io/assistant-ia-newsletter-com-snum/archives.html"
          } >> "$GITHUB_STEP_SUMMARY"

  deploiement:
    needs: collecte
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
